name: "Skill Improvement"
description: "A skill covers the topic but the guidance could be clearer, more complete, or better structured."
labels: ["improvement"]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Affected skill
      options:
        - jni-kotlin-pro
        - kmp-mvi
        - kmp-design-system
        - kmp-design-system-extended
        - kmp-feature-scaffold
        - kmp-clean-architecture
        - kmp-presenter-module
        - kmp-network-layer
        - kmp-repository-pattern
        - kmp-navigation
        - kmp-sqldelight-setup
        - kmp-expect-actual
        - kmp-unit-testing
        - kmp-roborazzi
        - kmp-code-quality
        - kmp-audit
        - Other (specify below)
    validations:
      required: true
  - type: input
    id: other-skill
    attributes:
      label: Other skill name
      placeholder: "kmp-..."
  - type: textarea
    id: current-guidance
    attributes:
      label: Current guidance
      description: Quote or describe what the skill currently says.
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
      description: What would be clearer, more complete, or better structured? Why?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context (optional)
      description: Were you working on a specific project type or use-case that exposed the gap?
