name: KMM Skills Governance Audit

# Reusable workflow — call from a consumer project:
#
#   jobs:
#     kmm-governance:
#       uses: ronjunevaldoz/kmm-agent-skills/.github/workflows/kmm-audit.yml@main
#       with:
#         project_root: .
#         fail_on: HIGH

on:
  workflow_call:
    inputs:
      project_root:
        description: Path to the KMP project root relative to the repo root
        type: string
        default: .
      fail_on:
        description: Minimum severity that fails the build (HIGH, MEDIUM, LOW)
        type: string
        default: HIGH
      skills_ref:
        description: kmm-agent-skills branch or tag to pin (e.g. main, v1.24.1)
        type: string
        default: main

jobs:
  governance:
    name: KMM Skills Governance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout consumer project
        uses: actions/checkout@v4

      - name: Checkout kmm-agent-skills
        uses: actions/checkout@v4
        with:
          repository: ronjunevaldoz/kmm-agent-skills
          ref: ${{ inputs.skills_ref }}
          path: .kmm-skills-repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run governance check
        run: |
          python3 .kmm-skills-repo/skills/kotlin-multiplatform-audit/scripts/governance_check.py \
            "${{ inputs.project_root }}" \
            --fail-on "${{ inputs.fail_on }}"
